name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build web app
        env:
          PFX_PUBLIC_BASE: /pfx-image-inspector/
        run: pnpm --filter @pfx/image-inspector-web build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
