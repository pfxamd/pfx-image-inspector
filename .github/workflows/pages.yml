name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve app version
        shell: bash
        run: |
          baseline=4e58f544a93ed88985b8fe830efd3cff2004047b
          git merge-base --is-ancestor "$baseline" HEAD
          count=$(git rev-list --first-parent --count "$baseline..HEAD")
          if (( count < 1 )); then
            echo "No release commit found after baseline" >&2
            exit 1
          fi
          echo "VITE_APP_VERSION=0.1.$((count - 1))" >> "$GITHUB_ENV"

      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build web app
        env:
          PFX_PUBLIC_BASE: /pfx-image-inspector/
        run: pnpm --filter @pfx/image-inspector-web build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          runtime: node@24

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify published mobile inspector and Raster Core integration
        run: node scripts/verify-live-raster.mjs
